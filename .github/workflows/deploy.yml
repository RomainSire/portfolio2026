name: Construire et publier l'image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # pnpm avant setup-node : le cache « pnpm » a besoin du binaire pour
      # résoudre le chemin du store. La version vient de packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Le build tourne aussi hors Docker : une erreur de type ou de contenu
      # doit faire échouer le job avant qu'une image ne soit publiée.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le VPS tire l'image lui-même. Deux voies possibles, à choisir avec
      # l'agent qui connaît la machine : un webhook (Watchtower, Diun) ou une
      # étape SSH ici. Rien n'est câblé tant que ce choix n'est pas fait.
