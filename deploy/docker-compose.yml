# Copie de référence de /opt/docker/portfolio-2026/docker-compose.yml sur le VPS.
# La version servie vient de TAG, écrit dans .env par deploy.sh : aucune image
# « latest » ne tourne en production, et revenir en arrière consiste à relancer
# deploy.sh avec une version précédente.
services:
  site:
    image: ghcr.io/romainsire/portfolio2026:${TAG:?TAG absent, lancer deploy.sh <version>}
    container_name: romainsire-site
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # La livraison passe par la CI : Watchtower ne doit pas s'en mêler.
      - "com.centurylinklabs.watchtower.enable=false"
      # --- HTTPS -------------------------------------------------------------
      - "traefik.http.routers.rs-site.rule=Host(`romainsire.com`) || Host(`www.romainsire.com`)"
      - "traefik.http.routers.rs-site.entrypoints=websecure"
      - "traefik.http.routers.rs-site.tls=true"
      - "traefik.http.routers.rs-site.tls.certresolver=letsencrypt"
      - "traefik.http.services.rs-site.loadbalancer.server.port=80"
      # --- www -> apex -------------------------------------------------------
      - "traefik.http.middlewares.rs-www.redirectregex.regex=^https://www\\.romainsire\\.com/(.*)"
      - "traefik.http.middlewares.rs-www.redirectregex.replacement=https://romainsire.com/$${1}"
      - "traefik.http.middlewares.rs-www.redirectregex.permanent=true"
      # --- HSTS --------------------------------------------------------------
      - "traefik.http.middlewares.rs-hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.rs-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.rs-hsts.headers.stsPreload=true"
      - "traefik.http.routers.rs-site.middlewares=rs-www,rs-hsts"

networks:
  traefik-public:
    external: true
