# Un add_header placé dans un bloc location annule tous ceux du bloc server.
# Les en-têtes qui varient selon la ressource passent donc par des map, et tous
# les add_header restent au niveau server.

# Le HTML est revalidé à chaque visite : un déploiement doit se voir. La règle
# porte sur le type servi et non sur l'URL : /a-propos sert a-propos.html.
map $sent_http_content_type $cache_html {
	~^text/html "public, max-age=0, must-revalidate";
	default     "";
}

# Les actifs empreintés sont immuables : on les met en cache un an.
map $uri $cache_control {
	~^/(_astro|fonts)/ "public, max-age=31536000, immutable";
	default            $cache_html;
}

map $uri $fonts_cors {
	~^/fonts/ "*";
	default   "";
}

server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Astro est configuré en build.format "file" : /a-propos -> /a-propos.html
	location / {
		try_files $uri $uri.html $uri/index.html =404;
	}

	error_page 404 /404.html;

	# Une valeur vide n'émet pas l'en-tête.
	add_header Cache-Control $cache_control always;
	add_header Access-Control-Allow-Origin $fonts_cors;

	gzip on;
	gzip_vary on;
	gzip_min_length 512;
	gzip_comp_level 6;
	gzip_types text/plain text/css application/javascript application/json
		image/svg+xml application/xml application/rss+xml font/woff2;

	# Le site ne charge rien depuis un domaine tiers : la politique peut être
	# stricte sans rien casser. 'unsafe-inline' couvre les styles de composant
	# d'Astro et les deux scripts inline (révélation, dé-obfuscation de l'email).
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

	# Journaux : conservés pour le fonctionnement et la sécurité uniquement.
	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log warn;
}
