server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Astro est configuré en build.format "file" : /a-propos -> /a-propos.html
	location / {
		try_files $uri $uri.html $uri/index.html =404;
	}

	error_page 404 /404.html;

	# Les actifs empreintés sont immuables : on les met en cache un an.
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}
	location /fonts/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header Access-Control-Allow-Origin "*";
		try_files $uri =404;
	}

	# Le HTML est revalidé à chaque visite : un déploiement doit se voir.
	location ~* \.html$ {
		add_header Cache-Control "public, max-age=0, must-revalidate";
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 512;
	gzip_comp_level 6;
	gzip_types text/plain text/css application/javascript application/json
		image/svg+xml application/xml application/rss+xml font/woff2;

	# Le site ne charge rien depuis un domaine tiers : la politique peut être
	# stricte sans rien casser. 'unsafe-inline' couvre les styles de composant
	# d'Astro et les deux scripts inline (révélation, dé-obfuscation de l'email).
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

	# Journaux : conservés pour le fonctionnement et la sécurité uniquement.
	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log warn;
}
